description: >-
  Autodesk publishes NO rate limits for PowerMill's programmable surfaces, because there is no
  network API to limit. Macro commands and the Autodesk.ProductInterface.PowerMILL .NET/COM library
  execute in-process against a PowerMill session running on the caller's own machine; throughput is
  bounded by that workstation's CPU and by the PowerMill licence, not by a server-side quota.
  This file REPLACES a 2026-05-04 scaffold that asserted X-RateLimit-* headers, 429/503 response
  codes and per-tier requests-per-minute quotas. None of those exist — PowerMill returns no HTTP
  responses at all.
limit_count: 0
headers: {}
responseCodes: {}
limits: []
constraints:
  - kind: licence
    description: >-
      Automation requires a licensed PowerMill seat; the .NET library attaches to (or launches) an
      installed PowerMill instance, so concurrency is bounded by available seats.
  - kind: local-compute
    description: >-
      Toolpath computation is CPU-bound on the workstation. The PowerMill Project Server queues and
      processes projects serially in its own PowerMill session; it is a local batch queue, not a
      throttled service.
