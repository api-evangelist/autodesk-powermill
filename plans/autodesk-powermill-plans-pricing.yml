description: >-
  PowerMill is licensed as named-user seat subscription software, not as a metered API. Its
  programmable interfaces — macro commands and the Autodesk.ProductInterface.PowerMILL .NET/COM
  automation library — are included with the seat at no additional cost and are not separately
  priced, quota'd or tiered. There is no API plan, no request quota and no overage: an automation
  script runs in-process against a licensed PowerMill session on the customer's own machine.
  This file REPLACES a 2026-05-04 scaffold that asserted a "Free" tier with a 1,000-requests/month
  quota against https://local-powermill-instance. That tier does not exist and was never published
  by Autodesk.
