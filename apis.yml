aid: autodesk-powermill
name: Autodesk PowerMill
description: >-
  Autodesk PowerMill is a leading CAM (Computer-Aided Manufacturing) software
  solution for high-speed and 5-axis CNC machining. It is used by aerospace,
  automotive, mold and die, and precision engineering industries to generate
  toolpaths for complex part manufacturing. PowerMill provides multiple
  programming interfaces including Macro scripts, Python API, and .NET/COM
  interfaces for automating manufacturing workflows, customizing toolpath
  generation, and integrating with broader manufacturing execution systems.
type: Index
deliveryModel:
  model: library
  open_source: true
  commercial: true
  callable_host: false
  label: Library · distributed through package registries, no callable service
  confidence: high
  source:
  - https://www.nuget.org/packages/Autodesk.ProductInterface.PowerMILL
  - https://github.com/Autodesk/PowerShapeAndPowerMillAPI
  - packages/autodesk-powermill-packages.yml
  generated: '2026-09-06'
  method: searched
  note: >-
    PowerMill is installed Windows desktop software with no hosted endpoint. Its programmable surface
    is a local, in-process .NET/COM automation library (MIT licensed, published to NuGet by Autodesk)
    plus macro commands executed inside a running PowerMill session. The product itself is commercial
    and licensed per named-user seat; the API library around it is open source. The prior 'saas /
    Hosted service · you call their endpoint' classification was wrong — there is no endpoint.
