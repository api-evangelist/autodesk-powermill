note: >-
  PowerMill has no HTTP API and therefore no HTTP client SDKs. Its programmable surface is a
  local .NET/COM automation library that drives an installed PowerMill session on the same
  Windows machine. Autodesk publishes that library as open source (MIT) and ships it to NuGet
  under the "Autodesk Inc" publisher account. Registry search for "powermill" returns exactly
  two packages, both first-party; searches of PyPI (powermill, pypowermill, autodesk-powermill),
  npm (powermill, @autodesk/powermill), and RubyGems return nothing. The PyPI package "pymill"
  is unrelated (a Paymill payments client).
